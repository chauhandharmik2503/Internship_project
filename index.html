<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshBite</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

<header>

    <img class="nav" src="Image/Icon/logo.jpg">

    

    <h3><i>Online Food Ordering Site</i></h3>

    <nav>
        <a href="#about_us"><img class="nav" src="Image/Icon/aboutus.png"></a>
        <a href="#contect_us"><img class="nav" src="Image/Icon/contactus.png"></a>
    </nav>

    <hr>

</header>


<main>

    <!-- HOME -->
    <div class="page" id="home">

        <h2>Home</h2>

        <img id="welcome" src="logo.png">

    </div>


    <!-- MENU -->
    <div class="page" id="menu">

        <h2>Menu</h2>

        <div id="filter">

            Filter<br>

            <button onclick="filter('all')">All</button>

            <button onclick="filter('hot_and_fresh')">
                Hot and Fresh
            </button>

            <button onclick="filter('dessert')">
                Dessert
            </button>

            <button onclick="filter('drinks')">
                Drinks
            </button>

        </div>

        <br>

        <hr>

        <!-- JavaScript will create food items here -->
        <div id="menu-items"></div>

    </div>


    <!-- CART -->
    <div class="page" id="cart">

        <h2>Cart</h2>

        <p>Order Details</p>

        <p id="order-detail"></p>

        <button onclick="payment()">
            Confirm Order
        </button>

    </div>


    <!-- USER -->
    <div class="page" id="user">

        <h2>User</h2>

        <p>Order History</p>

        <p id="order-history"></p>

    </div>


    <!-- ABOUT US -->
    <div class="page" id="about_us">

        <h2>About Us</h2>

        <h3>FreshBite</h3>

        <p>
            Online platform where you can find
            best taste with fresh food.
        </p>

    </div>


    <!-- CONTACT US -->
    <div class="page" id="contect_us">

        <h2>Contact Us</h2>

        <button id="instagram">
            <img src="insta.png">
            <br>
            @freshbite_007
        </button>

        <button id="facebook">
            <img src="facebook.png">
            <br>
            freshbite@47
        </button>

        <button id="google">
            <img src="google.png">
            <br>
            freshbite.com
        </button>

        <button id="gmail">
            <img src="gmail.png">
            <br>
            freshbite@gmail.com
        </button>

    </div>

</main>


<hr>

<footer>

    <nav>
        <a href="#home"><img class="nav" src="Image/Icon/home.png"></a>
        <a href="#menu"><img class="nav" src="Image/Icon/menu.png"></a>
        <a href="#cart"><img class="nav" src="Image/Icon/cart.png"></a>
        <a href="#user"><img class="nav" src="Image/Icon/user.png"></a>
        
    </nav>
    <h2>
        "Good food is the foundation of genuine happiness"
        - Auguste Escoffier
    </h2>

</footer>


<!-- JavaScript file -->
<script src="script.js"></script>

</body>
</html>
